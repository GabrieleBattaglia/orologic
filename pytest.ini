# Orologic, configurazione delle prove automatiche.
# Autori: Gabriele Battaglia (IZ4APU) & ClaudIA (Claude Opus 5.5, modalita' auto).
#
# La cattura dell'uscita e' spenta: le prove della finestra deviano
# sys.stdout verso l'area, e pytest a ogni fase lo rimetterebbe al suo.
[pytest]
testpaths = tests
addopts = -p no:cacheprovider --capture=no
