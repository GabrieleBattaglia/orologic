name = orologic
summary = "Orologic"
description = "Support for Orologic, the chess program for blind and visually impaired players. In its interactive board NVDA does not speak the character under the cursor, because Orologic announces the square and its piece; and the braille display follows the text that Orologic updates by itself, such as the clocks in the prompt. It acts only on the areas that Orologic marks, and nowhere else. Licensed under the GNU General Public License version 2 or later."
author = "Gabriele Battaglia (IZ4APU) and ClaudIA"
url = https://github.com/GabrieleBattaglia/orologic
version = 1.0.1
minimumNVDAVersion = 2024.1.0
lastTestedNVDAVersion = 2026.3.1
